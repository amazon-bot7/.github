
name: Amazon Affiliate Earning Bot

on:
  schedule:
    # Yeh code har ghante automatically run hoga (minute 0 par)
    - cron: '0 * * * *'
  workflow_dispatch: # Isse aap manually bhi run kar payenge

jobs:
  execute-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3
      
    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Orchestrator Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
      run: |
        python main.py
